name: test

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: node --test --test-concurrency=1
      - name: Check public files
        run: node scripts/check-public.mjs
